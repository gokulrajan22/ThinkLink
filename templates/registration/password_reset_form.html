<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password reset · ThinkLink</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f6f5fb;padding:24px}.card{max-width:500px;margin:8vh auto;background:white;padding:30px;border-radius:18px}input{padding:11px;width:100%;box-sizing:border-box}button{margin-top:16px;padding:12px;background:#654bd0;color:white;border:0;border-radius:8px}</style></head><body><main class="card"><a href="/">ThinkLink</a><h1>Reset password</h1><p>Enter the email address associated with your verified account. If it matches, we will send a reset link.</p><form method="post">{% csrf_token %}{{ form.email.label_tag }}{{ form.email }}{{ form.email.errors }}<button type="submit">Send reset link</button></form><p><a href="{% url 'login' %}">Back to sign in</a></p></main></body></html>
